<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Chill Thrive</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="header">
        <h1 class="header-title">Chill Thrive</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav class="nav-menu">
            <div class="header-link"><a href="home.html" class="Hlink"><button class="Hbutton">Home</button></a></div>
            <div class="header-link"><a href="services.html" class="Hlink"><button class="Hbutton">Services</button></a></div>
            <div class="header-link"><a href="awareness.html" class="Hlink"><button class="Hbutton">Awareness</button></a></div>
            <div class="header-link"><a href="founder.html" class="Hlink"><button class="Hbutton">Founder</button></a></div>
            <div class="header-link"><a href="testimonials.html" class="Hlink"><button class="Hbutton">Testimonials</button></a></div>
            <div class="header-link"><a href="gallery.html" class="Hlink"><button class="Hbutton">Gallery</button></a></div>
            <div class="header-link"><a href="contact.html" class="Hlink"><button class="Hbutton">Contacts</button></a></div>
            <div class="header-link"><button class="Hbutton" id="logoutBtn" type="button">Logout</button></div>
            <div class="header-link"><a href="BookSession.html" class="Hlink"><button class="Hbutton">Book Now &#128198;</button></a></div>
        </nav>
    </header>


    <main class="auth-page">
        <section class="auth-card confirmation-card">
            <div class="auth-heading">
                <p class="eyebrow">BOOKING CONFIRMED</p>
                <h1>You're All Set!</h1>
                <p>Your Chill Thrive session has been saved successfully.</p>
            </div>
            <div id="bookingDetails" class="confirmation-details"></div>
            <a class="primary-auth-btn back-home" href="home.html">Back to Home</a>
        </section>
    </main>

    <script>
        const booking = JSON.parse(localStorage.getItem("chillThriveLastBooking") || "null");
        const box = document.getElementById("bookingDetails");

        if (!booking) {
            box.innerHTML = "<p>No recent booking found.</p>";
        } else {
            box.innerHTML = `
                <div><span>Booking ID</span><strong>${booking.id}</strong></div>
                <div><span>Service</span><strong>${booking.service}</strong></div>
                <div><span>Date</span><strong>${booking.date}</strong></div>
                <div><span>Time</span><strong>${booking.time}</strong></div>
                <div><span>Guests</span><strong>${booking.people}</strong></div>
                <div><span>Total</span><strong>₹${booking.total.toLocaleString("en-IN")}</strong></div>
            `;
        }
    </script>

    <style>
        .confirmation-card { max-width: 560px; }
        .confirmation-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #eef9fc;
            border-radius: 14px;
            padding: 18px;
        }
        .confirmation-details div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .confirmation-details span {
            font-size: 12px;
            color: #78919c;
        }
        .confirmation-details strong {
            color: #247198;
        }
        .back-home {
            display: block;
            margin-top: 22px;
            text-align: center;
            text-decoration: none;
        }
        @media (max-width: 550px) {
            .confirmation-details { grid-template-columns: 1fr; }
        }
    </style>
</body>
</html>
