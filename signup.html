<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Chill Thrive</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="header">
        <div class="brand"><a href="home.html">Chill Thrive</a></div>
        <div class="header-link"><a href="home.html" class="Hlink"><button class="Hbutton">Home</button></a></div>
        <div class="header-link"><a href="services.html" class="Hlink"><button class="Hbutton">Services</button></a></div>
        <div class="header-link"><a href="awareness.html" class="Hlink"><button class="Hbutton">Awareness</button></a></div>
        <div class="header-link"><a href="contact.html" class="Hlink"><button class="Hbutton">Contacts</button></a></div>
        <div class="header-button"><button class="buttonX"><a href="BookSession.html" class="button-link">Book Now &#128198;</a></button></div>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-heading">
                <p class="eyebrow">START YOUR JOURNEY</p>
                <h1>Create Account</h1>
                <p>Sign up to manage your Chill Thrive bookings.</p>
            </div>

            <form id="signupForm">
                <label for="signupName">Full name</label>
                <input id="signupName" type="text" placeholder="Your name" required minlength="2">

                <label for="signupEmail">Email</label>
                <input id="signupEmail" type="email" placeholder="you@example.com" required>

                <label for="signupPassword">Password</label>
                <div class="password-wrap">
                    <input id="signupPassword" type="password" placeholder="At least 6 characters" required minlength="6">
                    <button type="button" class="show-password" data-target="signupPassword">Show</button>
                </div>

                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" placeholder="Re-enter your password" required minlength="6">

                <p id="signupMessage" class="form-message" aria-live="polite"></p>
                <button class="primary-auth-btn" type="submit">Create Account</button>
            </form>

            <p class="switch-auth">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
